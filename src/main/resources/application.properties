
### DATABASE ###
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.jpa.properties.hibernate.default_schema=main
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

### HIKARICP CONNECTION POOL ###
# DB max_connections=100, sisakan ~10 untuk superuser/admin/monitoring
# Jika ada service lain yang connect ke DB yang sama, kurangi nilai ini
spring.datasource.hikari.maximum-pool-size=80
spring.datasource.hikari.minimum-idle=10
# Gagal cepat jika semua koneksi sedang dipakai, daripada VT menumpuk tak terbatas
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

server.error.include-message=always

application.domain=core-service

### KAFKA ###
spring.kafka.bootstrap-servers=
messaging.outgoing.export-report-request.topic=${application.domain}-export-report-request
messaging.outgoing.export-report-result.topic=${application.domain}-export-report-result

### AWS ###
aws.region=
aws.s3.bucket.name=

### VIRTUAL THREAD ###
spring.threads.virtual.enabled=true

### SERVER / TOMCAT ###
# Batasi VT yang dibuat sekaligus agar antrian HikariCP tidak membengkak tak terbatas
# Formula: pool_size + (pool_size * target_wait_ms / avg_query_ms)
# Dengan pool=80, target_wait=200ms, avg_query~50ms: 80 + (80*4) = 400
# Sisa request menunggu di TCP backlog (tidak konsumsi heap JVM)
server.tomcat.max-connections=400
server.tomcat.accept-count=100
server.tomcat.connection-timeout=5000