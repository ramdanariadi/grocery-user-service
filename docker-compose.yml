version: '3.9'
services:
  db:
    image: postgres:13
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_USER: postgres
      POSTGRES_DB: grocery
      PGDATA: /var/lib/postgresql/data/ecomerce
    ports:
      - "5432:5432"
    volumes:
      - tunas_pgdb_data:/var/lib/postgresql/data/ecomerce
    networks:
      - tunas-network
  grocery-user-service-vt-off:
    image: grocery-user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/grocery
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: public
      # SPRING_JPA_HIBERNATE_DDL_AUTO: UPDATE
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_THREADS_VIRTUAL_ENABLED: FALSE
      AWS_S3_BUCKET_NAME:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_REGION:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      # Batasi explicit agar setara dengan vt-on (max-connections=200)
      # Tanpa ini, platform thread menerima 400 TCP tapi hanya memproses 200 (threads.max=200)
      # → vt-off punya "buffer" TCP 2x lebih besar → unfair advantage
      SERVER_TOMCAT_MAX_CONNECTIONS: 200
      SERVER_TOMCAT_ACCEPT_COUNT: 100
    networks:
      - tunas-network
    restart: on-failure
    ports:
      - "8080:8080"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 2
    depends_on:
      - db
      - kafka
  grocery-user-service-vt-on:
    image: grocery-user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/grocery
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: public
      # SPRING_JPA_HIBERNATE_DDL_AUTO: UPDATE
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_THREADS_VIRTUAL_ENABLED: TRUE
      AWS_S3_BUCKET_NAME:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_REGION:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m -Djdk.tracePinnedThreads=short -Djdk.virtualThreadScheduler.parallelism=4 -Djdk.virtualThreadScheduler.maxPoolSize=8"
      SPRING_JPA_SHOW_SQL: FALSE
      # Samakan dengan threads.max=200 (default platform thread) agar perbandingan adil
      # Dengan VT, tidak ada thread pool limit — max-connections adalah satu-satunya batas concurrency
      SERVER_TOMCAT_MAX_CONNECTIONS: 200
      SERVER_TOMCAT_ACCEPT_COUNT: 100
      SERVER_TOMCAT_CONNECTION_TIMEOUT: 5000
    networks:
      - tunas-network
    restart: on-failure
    ports:
      - "8081:8080"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 2
    depends_on:
      - db
      - kafka
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1  
    networks:
      - tunas-network
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - tunas-network

networks:
  tunas-network:
    driver: bridge

volumes:
  tunas_pgdb_data:
